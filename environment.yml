name: roigbiv
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - "numpy>=1.24.3,<2.0"
  - scipy
  - pandas
  - tifffile
  - scikit-image
  - matplotlib
  - pyyaml
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu130
    - torch
    - torchvision
    - suite2p
    - "cellpose<4.0.0"
    - tables
    - streamlit
    - ipywidgets
    - "napari[all]>=0.4.19"
    # roifile: ImageJ RoiSet.zip reader. Already used by
    # scripts/process_external_data.py and scripts/centroid_bakeoff/ but was
    # never declared here (pre-existing gap, fixed as part of the latter).
    - roifile
    # opencv-python-headless: scripts/centroid_bakeoff/'s OpenCV detector arm.
    # NOTE: pyproject.toml's core deps list "opencv-python" (GUI build), while
    # cellpose transitively pulls in "opencv-python-headless" — both currently
    # coexist in this env and both provide the `cv2` import. Not resolved here;
    # see pyproject.toml's dependencies comment.
    - opencv-python-headless
    - -e .
