# ── ROI G. Biv — Combined Pipeline Configuration ─────────────────────────────
# All tunable parameters for the Suite2p + Cellpose consensus pipeline.
# Override individual values with CLI flags; this file provides defaults.
#
# NOTE: This file is DOCUMENTARY. The runtime does not load it — see
# `roigbiv/pipeline/types.py::PipelineConfig` for the values actually used.
# Edits here change nothing without a matching `types.py` default update.
# Variant presets (e.g. `pipeline.prism.yaml`) are also documentary.

cellpose:
  # Path to the deployed Cellpose model (relative to project root)
  model_path: models/deployed/current_model

  # Expected cell diameter in pixels (GRIN lens neurons ~12 px)
  diameter: 12

  # Channel config: [1, 2] = dual-channel [mean, Vcorr]; [0, 0] = grayscale
  channels: [1, 2]

  # Flow field error threshold — 0.6 is more permissive for GRIN aberrated boundaries
  flow_threshold: 0.6

  # Cell probability threshold — -2.0 accepts dimmer, less certain cells (GRIN low SNR)
  cellprob_threshold: -2.0

  # Tile normalization compensates for GRIN vignetting (block size in pixels)
  tile_norm_blocksize: 128

  # Optional Cellpose3 image restoration before segmentation
  denoise: false

motion_correction:
  # Registration backend. CLI: --motion-correction {phasecorr|rowwise-pcc|legacy}.
  # "phasecorr" (default): Suite2p rigid + non-rigid registration via
  #   roigbiv/suite2p.py (the `suite2p:` section below tunes this path). Robust
  #   on dim/low-SNR FOVs; matches legacy SIMA quality.
  # "rowwise-pcc" (opt-in): GPU row-wise non-rigid phase correlation
  #   (roigbiv/pipeline/registration.py). Fast on torch/CUDA. The strip
  #   regularization below (taller strips + median/confidence + smoothing)
  #   suppresses the noise-driven per-row warps of the original bench audit
  #   (~30× less spurious warp on a still frame); disabling it reverts to them.
  # "legacy" (opt-in): genuine SIMA HiddenMarkov2D(granularity='row') run in the
  #   sima-legacy py3.8 sidecar conda env via subprocess
  #   (roigbiv/pipeline/legacy_mc.py + scripts/sima_mc_worker.py). CPU-only and
  #   slow; a faithful reproduction of the legacy notebook. Build the env once
  #   with `bash envs/build_sima_legacy.sh`.
  # All backends export {stem}_mc.tif into the per-FOV output dir.
  backend: phasecorr

  # rowwise-pcc tunables (CLI: --mc-max-displacement / --mc-strip-height /
  # --mc-template-iters / --mc-prefilter / --mc-smooth-rows). Remaining knobs
  # are types.py-only. max_displacement is shared with the legacy backend.
  max_displacement: 50    # px clamp on rigid + per-strip shifts (SIMA parity)

  # legacy (SIMA) backend tunables (CLI: --mc-sima-env / --mc-granularity).
  sima_env: sima-legacy   # conda env hosting SIMA 1.3.2
  granularity: row        # SIMA HMM2D granularity ('row' non-rigid | 'frame' rigid)
  strip_height: 32        # horizontal strip height in rows for the non-rigid step
  n_template_iters: 2     # template refinement iterations
  subpixel_upsample: 10   # parabolic-refinement precision knob
  frame_batch: 256        # frames per GPU batch (auto-capped by free VRAM)
  # Quality-parity knobs (Option B). These suppress noise-driven per-row warps.
  smooth_sigma_rows: 6.0       # per-row displacement-field smoothing
  smooth_sigma_time: 1.0       # temporal smoothing across the frame batch
  strip_confidence_weight: true  # median + confidence outlier rejection
  # DoG band-pass: off by default (helps only with structured background; on
  # white-noise-limited frames it degrades the peak). Bench per dataset.
  prefilter: false
  prefilter_sigma_low: 1.0     # shot-noise suppression (small blur)
  prefilter_sigma_high: 8.0    # background high-pass (large blur)

suite2p:
  # ── Data ──
  # 0 = activity-based detection (temporal correlation, default for this pass)
  # 1 = anatomy-based detection  (mean-image morphology; safe with Cellpose 4.x)
  # 2 = Cellpose-backed           NOT USED (imports Cellpose internally)
  # Activity and anatomy passes are run as separate invocations; both outputs
  # are combined in union ROI building. This config applies to the activity pass.
  anatomical_only: 0

  # Number of imaging planes (single-plane for this dataset)
  nplanes: 1

  # Number of channels (single-channel GCaMP)
  nchannels: 1

  # Which channel contains functional signal (1-indexed)
  functional_chan: 1

  # GCaMP6s decay time constant in seconds
  tau: 1.0

  # Acquisition frame rate in Hz (uniform across all FOVs)
  fs: 30.0

  # ── Registration (phasecorr backend) ──
  # NOTE: pipeline.yaml is a documentary defaults reference — it is NOT loaded at
  # runtime. The phasecorr registration pass is driven by PipelineConfig.mc_s2p_*
  # (defaults below) and overridden by the --mc-* CLI flags. The sweep harness
  # behind these is scripts/sweep_suite2p_reg.py.
  #
  # TUNED DEFAULTS (block_size=[64,64] + 1Preg=true): full-session validation on
  # the Logan Prism FOV (2271-frame mean vs a grid-aligned legacy SIMA mean)
  # showed the old [128,128]/no-1Preg default reached only 58% of legacy cell-
  # sharpness; these reach ~103% (at/above legacy), no over-fit banding. [64,64]
  # alone gets 91%; 1Preg supplies the rest but is a 1-photon high-pass — for
  # bright high-SNR 2P (non-Prism) data pass --no-mc-1preg / --mc-block-size 128 128.
  do_registration: 1            # auto: _mc filenames → OFF, else ON

  nimg_init: 300                # frames for reference-image computation
  batch_size: 500              # frames per GPU batch (detection path; registration uses its own)
  smooth_sigma: 1.15            # spatial Gaussian blur of the reference (px)
  smooth_sigma_time: 0          # temporal smoothing for shift estimation. CLI: --mc-smooth-sigma-time.
                                # Raises SNR on dim frames but net-hurt on prism in the sweep.
  maxregshift: 0.1              # rigid shift clamp (fraction of frame)
  nonrigid: true                # enable piecewise (non-rigid) registration
  block_size: [64, 64]          # TUNED. non-rigid block px. CLI: --mc-block-size H W. Finer than the
                                # old [128,128]; [32,32] over-fits (background speckle) — do not go finer.
  maxregshiftNR: 5              # max non-rigid block shift (px). CLI: --mc-maxregshift-nr.
  two_step_registration: false  # rigid then non-rigid. CLI: --mc-two-step-reg.
  # 1-photon high-pass before registration (Suite2p 1Preg family). Raises shift-
  # estimation SNR on dim/low-contrast GRIN/prism frames. CLI: --mc-1preg / --no-mc-1preg.
  "1Preg": true                 # TUNED (load-bearing for legacy parity; off = bright-2P path)
  spatial_hp_reg: 42            # spatial high-pass window (px)
  pre_smooth: 0                 # pre-high-pass Gaussian smoothing
  spatial_taper: 40             # edge px tapered out of registration

  # ── Detection ──
  # Spatial scale: 0 = auto-detect from data. Cell diameter ~30 px → scale ~2
  spatial_scale: 0

  # Detection sensitivity multiplier. Lower = more permissive (0.5 for GRIN lens)
  threshold_scaling: 0.5

  # Max iterations for ROI detection refinement
  max_iterations: 20

  # Require detected ROIs to be spatially connected
  connected: true

  # Number of frames binned for the detection reference image
  nbinned: 5000

  # Non-overlapping footprints simplify consensus mask rasterization
  allow_overlap: false

  # ── Classification ──
  # Pre-classification threshold: 0.0 = keep all candidates (consensus handles filtering)
  preclassify: 0.0

  # ── Neuropil ──
  # High-pass filter cutoff for neuropil subtraction
  high_pass: 100

  # Inner exclusion radius around ROI for neuropil annulus (pixels)
  inner_neuropil_radius: 2

  # Minimum pixels in neuropil annulus
  min_neuropil_pixels: 350

  # ── Spike deconvolution ──
  # Enable OASIS spike deconvolution
  spikedetect: true

  # Keep data.bin after processing (needed by Branch C and trace extraction)
  delete_bin: false

consensus:
  # Minimum spatial IoU to consider a Suite2p–Cellpose ROI pair as matched
  # 0.3 is conservative for irregular Suite2p footprints vs smooth Cellpose contours
  # Literature range: 0.3–0.5 (Giovannucci et al., CaImAn)
  iou_threshold: 0.3

  # Minimum Suite2p iscell probability to include an ROI as a candidate
  # 0.5 is permissive — borderline cells enter consensus adjudication
  s2p_min_iscell_prob: 0.5

  # Tier definitions (for reference; logic is in match_rois.py)
  #   GOLD:   both Suite2p and Cellpose agree (IoU >= iou_threshold)
  #   SILVER: Cellpose-only (no Suite2p match or IoU < threshold)
  #   BRONZE: Suite2p-only (no Cellpose match or IoU < threshold)

  # Which tiers to include in the default output mask for downstream analysis
  default_tiers: [gold, silver]

tonic:
  # ── Bandpass filtering (Step 6) ──
  # Neuronal band: isolates GCaMP6s calcium transient fluctuations
  band_lo: 0.05
  band_hi: 2.0

  # Butterworth filter order
  filter_order: 3

  # ── SVD compression ──
  # Number of SVD components for temporal compression
  n_components: 500

  # Frames per chunk when streaming data.bin (controls peak RAM)
  chunk_frames: 500

  # ── Local correlation (Step 7) ──
  # Neighborhood radius in pixels (~soma radius)
  soma_radius: 8

  # Minimum Pearson correlation to count as correlated
  corr_threshold: 0.25  # was 0.15

  # ── Size filtering ──
  # Min/max ROI area in pixels (reject noise clusters and neuropil patches)
  min_roi_pixels: 80
  max_roi_pixels: 350  # was 300

  # ── Morphological filtering ──
  # Minimum solidity (area / convex-hull area); rejects spindly/concave neuropil fragments
  min_solidity: 0.6
  # Maximum eccentricity of equivalent ellipse; rejects elongated axon/process fragments
  max_eccentricity: 0.85

  # ── Astrocyte band (Phase 2 extension) ──
  astrocyte_band_lo: 0.01
  astrocyte_band_hi: 0.3

merge:
  # Minimum IoU to declare a match between any two branches
  iou_threshold: 0.3
  # Minimum Suite2p iscell probability to include Branch B ROIs
  s2p_min_prob: 0.0
  # Discard Branch C-only ROIs whose centroid is below the FOV 25th-percentile intensity
  require_spatial_support: true

traces:
  # Neuropil surround parameters
  inner_radius: 2
  min_neuropil_pixels: 350
  # Baseline estimation for dF/F
  baseline_window_seconds: 60.0
  baseline_percentile: 10.0
  # Tonic neurons get wider baseline window (multiplier)
  tonic_baseline_multiplier: 2.0
  # Streaming chunk size (controls peak RAM; 200 frames ~ 100 MB for 512x512)
  chunk_frames: 200
  # Spike deconvolution (OASIS via Suite2p)
  do_deconvolve: true

classify:
  # Stage A: cell/not-cell thresholds
  snr_min: 2.0
  area_min: 30
  area_max: 500
  compact_min: 0.15
  # Stage B: activity-type thresholds
  skew_phasic: 1.5
  cv_tonic: 0.3
  min_transients_sparse: 5

paths:
  # All paths relative to project root (~/Otis-Lab/Projects/Phoxel-Workbench/roigbiv)
  raw_dir: data/raw
  annotated_dir: data/annotated
  masks_dir: data/masks
  max_projections_dir: data/max_projections
  s2p_output: suite2p_workspace/output
  inference_output: inference/output
  tonic_output: inference/tonic
  merged_output: inference/merged
  traces_output: inference/traces
  classified_output: inference/classified
  consensus_output: inference/consensus

hardware:
  # Pass --cpu to force CPU-only execution for all Torch/Cellpose/SVD stages.
  # Suite2p auto-detects device; no flag needed (falls back to CPU when CUDA absent).
  # --cpu also sets ROIGBIV_ROICAT_ALIGNMENT=PhaseCorrelation (RoMa is impractical on CPU).
  # CPU mode is 5–10× slower for Cellpose/SVD; Suite2p batch_size 50–100 reduces peak RAM.
  gpu: true  # informational; runtime uses PipelineConfig.force_cpu

  # RAM headroom: leave 3 GB free from 15 GB total
  max_ram_gb: 12
