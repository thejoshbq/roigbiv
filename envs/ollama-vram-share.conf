# systemd drop-in for the ollama daemon — share the 16 GB RTX 5080 with the
# roigbiv pipeline.
#
# WHY: ollama's default keep_alive holds a large model (e.g. qwen3-coder:30b
# ~18 GB) resident for 5 minutes after each call, monopolizing VRAM so the
# pipeline OOMs and falls back to CPU. KEEP_ALIVE=0 unloads each model
# immediately after its request (it reloads on the next call — a few seconds of
# latency, no quality loss), and MAX_LOADED_MODELS=1 prevents two models
# co-residing. Combined with roigbiv's per-run gpuguard preflight, the pipeline
# reliably gets the GPU.
#
# INSTALL (needs sudo — run these in the session with the `!` prefix):
#   ! sudo install -D -m644 envs/ollama-vram-share.conf \
#       /etc/systemd/system/ollama.service.d/vram-share.conf
#   ! sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# VERIFY:
#   ! ollama run qwen3-coder:30b "" >/dev/null ; sleep 3 ; ollama ps   # -> empty
#   ! nvidia-smi --query-gpu=memory.used --format=csv                  # -> low

[Service]
Environment="OLLAMA_KEEP_ALIVE=0"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
